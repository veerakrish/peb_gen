# Bounds for the synthetic drone-module netlist generator, and dataset paths.

synthetic:
  num_graphs: 2000
  modules_per_graph:
    min: 6
    max: 14
  module_catalog:
    # Each entry is a template the generator instantiates with jittered
    # dimensions/pin-counts. "count" is how many instances of this module
    # type may appear in a single generated board (min/max).
    - category: MCU
      width_mm: [20.0, 35.0]
      height_mm: [20.0, 35.0]
      pin_count: [16, 64]
      count: [1, 1]
    - category: ESC
      width_mm: [10.0, 20.0]
      height_mm: [10.0, 20.0]
      pin_count: [3, 6]
      count: [2, 4]
    - category: GPS
      width_mm: [15.0, 25.0]
      height_mm: [15.0, 25.0]
      pin_count: [4, 8]
      count: [0, 1]
    - category: PDB
      width_mm: [20.0, 30.0]
      height_mm: [20.0, 30.0]
      pin_count: [6, 12]
      count: [1, 1]
    - category: IMU
      width_mm: [3.0, 6.0]
      height_mm: [3.0, 6.0]
      pin_count: [6, 16]
      count: [0, 2]
    - category: RX
      width_mm: [10.0, 18.0]
      height_mm: [10.0, 18.0]
      pin_count: [4, 8]
      count: [0, 1]
    - category: CONNECTOR
      width_mm: [3.0, 8.0]
      height_mm: [3.0, 8.0]
      pin_count: [2, 4]
      count: [2, 6]
    - category: PASSIVE
      width_mm: [1.0, 5.0]
      height_mm: [1.0, 3.0]
      pin_count: [2, 2]
      count: [4, 12]

  pin_type_weights:
    power: 0.2
    ground: 0.25
    signal: 0.45
    high_speed: 0.1

  net_generation:
    # Every module always gets its power/ground pins tied to the shared
    # PDB rails; remaining signal/high_speed pins get randomly paired off
    # into point-to-point or small multi-pin nets.
    extra_random_nets_per_module: [1, 3]
    max_net_fanout: 4

  seed: 42

paths:
  output_dir: "data/raw/synthetic"
  real_data_dir: "data/raw/real"   # data/real_netlist_harvester.py output; mixed in alongside synthetic
  processed_dir: "data/processed"
