server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # In dev, vite.config.js's server.proxy forwards /api to the backend;
    # that only applies to `vite dev`, not this static nginx build, so the
    # same routing has to be reimplemented here. "backend" resolves via
    # Docker Compose's service-name DNS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }
}
